name: KunAI checks

on:
  push:
    branches: [main, feature/kunai-backup-2026-11-25]
  pull_request:
    branches: [main]

jobs:
  backup-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test backup import and export
        run: node --test tests/backup.test.mjs
