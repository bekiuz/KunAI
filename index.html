<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e16"><title>KunAI</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e16;color:#f2f4fa;font:15px system-ui,Segoe UI,sans-serif}header{padding:20px max(20px,calc((100% - 1040px)/2));border-bottom:1px solid #252b3b;font-weight:850;letter-spacing:.5px}header b{color:#a78bfa}.main{max-width:1040px;margin:auto;padding:34px 20px}.hero h1{font-size:clamp(30px,5vw,46px);margin:0 0 8px}.hero p,.muted,small{color:#9aa2b5}.panel{background:#151a27;border:1px solid #2b3244;border-radius:17px;padding:20px;margin-top:18px}.panel h2{font-size:19px;margin:0 0 16px}.form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}input,select,textarea{background:#0d121d;color:#f3f4f8;border:1px solid #343d52;border-radius:10px;padding:12px;min-width:0}input,select{flex:1}textarea{width:100%;margin-top:10px;resize:vertical}button{background:#8b70f6;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.alt,.ghost{background:#293145;color:#e7e9f2}.ghost{padding:8px 11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#191f2e;border:1px solid #2b3244;border-radius:13px;padding:15px}.stat b{display:block;font-size:23px}.stat small{display:block;margin-top:4px}.item,.job{background:#101521;border:1px solid #293247;border-radius:12px;padding:13px;margin-top:10px}.item{display:flex;align-items:center;gap:12px}.grow{flex:1}.grow small{display:block;margin-top:4px}.strike{text-decoration:line-through;color:#8b91a2}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{background:#2c2546;color:#cbbcff;border-radius:999px;padding:6px 10px;font-size:12px}.answers{display:grid;gap:10px}.answer{background:#222b3d;text-align:left}.answer.correct{background:#176448}.answer.wrong{background:#783c4b}.script{white-space:pre-wrap;line-height:1.7;background:#0d121d;padding:16px;border-radius:12px;min-height:150px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.toolbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.file-input{display:none}.foot{max-width:1040px;margin:0 auto;padding:15px 20px 30px;color:#717b91;font-size:12px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.form>*{width:100%;flex:auto}.main{padding-top:24px}}</style></head><body><header>B•BEKIUZ <b>KUNAI</b></header><main class="main"><section class="hero"><h1>KunAI</h1><p>Kuningizni rejalashtiring. Muhim ishlarni birinchi bajaring.</p></section><section class="panel"><h2>Yangi vazifa</h2><div class="form"><input id="task" placeholder="Masalan: IELTS Reading mashq qilish"><select id="priority"><option value="3">Muhim</option><option value="2" selected>O‘rtacha</option><option value="1">Keyinroq</option></select><input id="due" type="date"><button onclick="add()">Qo‘shish</button></div></section><section class="stats" id="stats"></section><section class="panel"><div class="bar"><h2>Vazifalarim</h2><div class="toolbar-actions"><button class="ghost" type="button" onclick="exportTasks()">Backup yuklab olish</button><button class="ghost" type="button" onclick="document.getElementById('importFile').click()">Backup yuklash</button><input class="file-input" id="importFile" type="file" accept="application/json,.json" onchange="importTasks(this)"><button class="ghost" onclick="clearDone()">Bajarilganlarni tozalash</button><select id="filter" onchange="render()"><option value="all">Barchasi</option><option value="open">Bajarilmagan</option><option value="done">Bajarilgan</option></select></div></div><div id="list"></div></section></main><footer class="foot">BEKIUZ · KunAI · Ma’lumotlar ushbu brauzerda saqlanadi. Demo versiya.</footer><script>let tasks=[];try{tasks=JSON.parse(localStorage.kunaiTasks||"[]");if(!Array.isArray(tasks))tasks=[]}catch(e){tasks=[]}function save(){localStorage.kunaiTasks=JSON.stringify(tasks);render()}function add(){let t=task.value.trim();if(!t)return;tasks.unshift({id:Date.now(),t,p:+priority.value,d:due.value,done:false});task.value="";save()}function toggle(id){tasks=tasks.map(x=>x.id===id?{...x,done:!x.done}:x);save()}function del(id){tasks=tasks.filter(x=>x.id!==id);save()}function clearDone(){if(!tasks.some(x=>x.done))return;if(!confirm("Bajarilgan vazifalar o‘chirilsinmi?"))return;tasks=tasks.filter(x=>!x.done);save()}function exportTasks(){const payload={version:1,exportedAt:new Date().toISOString(),tasks};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="kunai-backup.json";a.click();URL.revokeObjectURL(url)}
function importTasks(input){const file=input.files&&input.files[0];if(!file)return;if(file.size>5*1024*1024){alert("Backup fayli 5 MB dan katta bo‘lishi mumkin emas.");input.value="";return}const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(String(reader.result||""));const list=Array.isArray(data)?data:data&&data.version===1?data.tasks:null;if(!Array.isArray(list)||list.length>10000||list.some(x=>!x||typeof x.t!=="string"||!x.t.trim()||![1,2,3].includes(Number(x.p))||typeof x.done!=="boolean"||!Number.isSafeInteger(Number(x.id))||Number(x.id)<=0))throw new Error("invalid");const next=list.map(x=>({id:Number(x.id),t:x.t.trim().slice(0,300),p:Number(x.p),d:typeof x.d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(x.d)?x.d:"",done:x.done}));if(new Set(next.map(x=>x.id)).size!==next.length)throw new Error("duplicate ids");if(!confirm("Backup joriy vazifalarni almashtiradi. Davom etasizmi?"))return;tasks=next;save();alert("Backup muvaffaqiyatli yuklandi.")}catch(e){alert("Backup fayli noto‘g‘ri yoki buzilgan.")}finally{input.value=""}};reader.onerror=()=>{alert("Faylni o‘qib bo‘lmadi.");input.value=""};reader.readAsText(file)}
function render(){let done=tasks.filter(x=>x.done).length;let today=new Date();today=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);let overdue=tasks.filter(x=>!x.done&&x.d&&x.d<today).length;stats.innerHTML='<div class="stat"><b>'+tasks.length+'</b><small>Jami vazifa</small></div><div class="stat"><b>'+done+'</b><small>Bajarildi</small></div><div class="stat"><b>'+overdue+'</b><small>Muddati o‘tgan</small></div>';let f=filter.value;list.innerHTML=tasks.filter(x=>f==='all'||(f==='done'?x.done:!x.done)).sort((a,b)=>Number(a.done)-Number(b.done)||b.p-a.p||String(a.d||'9999-12-31').localeCompare(String(b.d||'9999-12-31'))).map(x=>'<article class="item"><input type="checkbox" '+(x.done?'checked':'')+' onchange="toggle('+x.id+')"><div class="grow"><strong class="'+(x.done?'strike':'')+'">'+esc(x.t)+'</strong><small>'+({1:'Keyinroq',2:'O‘rtacha',3:'Muhim'}[x.p])+(x.d?' · '+x.d:'')+'</small></div><button class="ghost" onclick="del('+x.id+')">O‘chirish</button></article>').join('')||'<p class="muted">Hozircha vazifa yo‘q.</p>'}function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}render();</script></body></html>
